<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${subject.name() + ' — keiko-engine'}">keiko-engine</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header class="masthead">
    <div class="masthead-left">
        <div class="vertical-mark"
             th:title="${subject.brandMark() + ' — ' + subject.name() + ' (' + projectVersion + ')'}"
             th:aria-label="${subject.brandMark() + ' — ' + subject.name() + ' (' + projectVersion + ')'}">
            <span th:each="ch : ${subject.brandMark().toCharArray()}" th:text="${ch}"></span>
        </div>
        <div class="masthead-titles">
            <h1 th:text="${subject.name()}">Subject</h1>
            <p class="subhead">
                <span th:text="${subject.subhead()}">Subhead</span>
                · <span id="pool-count" th:text="${defaultDeckCount}">0</span> cards in pool
            </p>
        </div>
    </div>
    <nav class="masthead-nav">
        <button id="deck-toggle" type="button">Default deck</button>
        <span class="version-chip" th:text="${projectVersion}" title="Project version (bumped per PR)">v0.1</span>
    </nav>
</header>

<main id="app">
    <section id="card-pane">
        <div class="card-counter">
            Card <span id="counter-current">1</span> of <span id="counter-total" th:text="${defaultDeckCount}">0</span>
        </div>
        <article id="card" class="card">
            <div class="card-stem" id="card-stem">Loading…</div>
            <ol class="card-choices" id="card-choices"></ol>
            <div class="card-back hidden" id="card-back">
                <div id="card-verdict"></div>
                <div id="card-correct"></div>
                <div id="card-explanation"></div>
                <ul id="card-citations" class="citations"></ul>
                <div id="card-attribution" class="attribution"></div>
            </div>
            <button id="next-btn" class="next-btn" hidden>Next →</button>
        </article>
    </section>
    <footer id="footer-motivation" class="motivation-footer"></footer>
</main>

<script th:inline="javascript">
    window.bootstrap = {
        subject: {
            id: /*[[${subject.id()}]]*/ "",
            name: /*[[${subject.name()}]]*/ "",
            brandMark: /*[[${subject.brandMark()}]]*/ ""
        },
        projectVersion: /*[[${projectVersion}]]*/ "v0.1",
        deckCounts: {
            default: /*[[${defaultDeckCount}]]*/ 0,
            experimental: /*[[${experimentalDeckCount}]]*/ 0
        }
    };
</script>
<script th:src="@{/js/app.js}" defer></script>
</body>
</html>
